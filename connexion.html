<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="base css/form.css">
    <h1>VEUILLEZ VOUS INSCRIRE</h1>
</head>
<body>
    
    <form action="">
        <label for="nom complet">NOM COMPLET</label>
        <input type="text" id="NOM COMPLET">
        <br><label for="sex">SEXE</label>
        <input type="radio" id="Feminin" name="SEXE">
        <label for="Feminin">Feminin</label>
        <input type="radio" id="masculin" name="SEXE">
        <label for="masculin">masculin</label>
        <br><label for="adresse de residence"> ADRESSE DE RESIDENCE</label>
        <input type="text" id="ADRESSE DE RESIDENCE">
        <br><label for="mail">ADRESSE MAIL</label>
        <input type="text" id="ADRESSE MAIL">
        <br><label for="provenance">ECOLE DE PROVENANCE/label>
        <input type="text" id="ECOLE DE PROVENANCE">
        <br><label for="class precedente">CLASSE PRECEDENTE</label>
        <input type="text" id="CLASSE PRECEDENTE">
        <br><label for="bulletin">BULLETIN</label>
        <input type="file" id="BULLETIN">
        <br><label for="option">OPTION SOUHAITEE</label>
        <select name="option" id="OPTION SOUHAITEE">
            <option value="">PEDAGOGIE GENERALE</option>
            <option value="">COMMERCIAL ET GESTION</option>
            <option value="">TECHNIQUE AGROCOLE</option>
            <option value="">TECHNIQUE SOCIALE</option>
        </select>
        <br><label for="OUTILS DE FORMATION">OUTILS DE FORMATION:</label>
        <label for="ordinateur">ORDINATEUR</label>
        <input type="checkbox" id="ordinateur" name="OUTILS DE FORMATION">
        <label for="telephone">TELEPHONE</label>
        <input type="checkbox" id="TELEPHONE" name="OUTILS DE FORMATION">
        <label for="tablette">TABLETTE</label>
        <input type="checkbox" id="TABLETTE" name="OUTILS DE FORMATION">
        <label for="tablette">IMPRIMANTE</label>
        <input type="checkbox" id="IMPRIMANTE" name="OUTILS DE FORMATION">
        <BR></BR><label for="message">QU'EST-CE QU'ON PEUT RETENIR SUR VOTRE PERSONNE</label>
        <br><textarea name="message" id="QU'EST-CE QU'ON PEUT RETENIR SUR VOTRE PERSONNE"></textarea>
        <br><button type="submit">SOUMETTRE</button>
    </form>
</body>
</html>
